    appli = firebase.initializeApp(CFG);
    auth = firebase.auth(); db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(function () { /* un autre onglet ou navigateur ancien */ });
    window.addEventListener('online', function () { S.enLigne = true; majEtat(); });
    window.addEventListener('offline', function () { S.enLigne = false; majEtat(); });
    auth.onAuthStateChanged(surAuth);
  }
  function col(nom) { return db.collection(ESPACE + '/' + nom); }
  function docEcole() { return db.doc(ESPACE); }

  /* ---------- écriture avec suivi des envois en attente ---------- */
  function suivre(promesse) {
    S.attente++; majEtat();
    return promesse.then(function (r) { S.attente--; S.derniereSync = maintenant(); majEtat(); return r; },
      function (err) { S.attente--; majEtat(); throw err; });
  }
  function meta(nouveau) {
    var m = { modifie_par: S.profil ? S.profil.identifiant : '?', modifie_le: maintenant() };
    if (nouveau) { m.cree_par = m.modifie_par; m.cree_le = m.modifie_le; m.version = 1; }
    return m;
  }
  function verifierEcriture(droit) {
    if (enMaintenancePourMoi()) throw new Erreur('Maintenance en cours par ' + S.ecole.maintenance.nom + ' : lecture seule pour le moment.');
    if (droit && !peut(droit)) throw new Erreur('Votre compte n\'a pas le droit « ' + DROITS[droit] + ' ».');
  }
  /** Crée un document ; renvoie son id */
  function creer(nom, data, droit, id) {
    verifierEcriture(droit);
    var ref = id ? col(nom).doc(id) : col(nom).doc();
    suivre(ref.set(Object.assign({}, data, meta(true)))).catch(erreurEcriture);
    return ref.id;
  }
  /**
   * Modifie avec verrouillage optimiste : si quelqu'un a enregistré entre-temps
   * (version différente de celle affichée), on propose de recharger ou d'écraser.
   */
  function modifier(nom, id, changements, versionLue, droit) {
    verifierEcriture(droit);
    var ref = col(nom).doc(id);
    if (!S.enLigne) {   /* hors ligne : écriture mise en file, version incrémentée */
      suivre(ref.update(Object.assign({}, changements, meta(), { version: (versionLue || 0) + 1 }))).catch(erreurEcriture);
      return Promise.resolve(true);
    }
    return suivre(db.runTransaction(function (tx) {
      return tx.get(ref).then(function (snap) {
        if (!snap.exists) throw new Erreur('Cet élément a été supprimé par quelqu\'un d\'autre.');
        var d = snap.data();
        if (versionLue !== undefined && d.version !== versionLue) { var c = new Erreur('conflit'); c.conflit = d; throw c; }
        tx.update(ref, Object.assign({}, changements, meta(), { version: (d.version || 0) + 1 }));
      });
    })).then(function () { return true; }, function (err) {
      if (err.conflit) {
        var d = err.conflit;
        var ecraser = confirm('Modifié par ' + d.modifie_par + ' ' + ilya(d.modifie_le) + ' pendant que vous travailliez.\n\n' +
                              'OK = écraser avec vos changements\nAnnuler = garder leur version (l\'écran se recharge)');
        if (ecraser) return modifier(nom, id, changements, d.version, droit);
        rendre(); return false;
      }
      erreurEcriture(err); return false;
    });
  }
  function supprimer(nom, id, droit) {
    verifierEcriture(droit);
    return suivre(col(nom).doc(id).delete()).catch(erreurEcriture);
  }
  /** Compteur atomique (matricule, pièce de caisse, document) : jamais deux fois le même numéro */
  function prochainNumero(nom) {
    var ref = col('compteurs').doc(nom);
    return suivre(db.runTransaction(function (tx) {
      return tx.get(ref).then(function (s) {
        var n = (s.exists ? s.data().valeur : 0) + 1;
        tx.set(ref, Object.assign({ valeur: n }, meta(!s.exists)));
        return n;
      });
    }));
  }
  function erreurEcriture(err) {
    if (err instanceof Erreur) toast(err.message, 'ko');
    else { console.error(err); toast('Enregistrement refusé : ' + messageAuth(err), 'ko'); }
  }
  function activite(texte) {
    if (!S.profil) return;
    col('activite').add({ texte: texte, par: S.profil.identifiant, nom: S.profil.nom, le: maintenant() }).catch(function () {});
  }
  function journal(evenement, detail, identifiant) {
    col('journal_acces').add({ le: maintenant(), identifiant: identifiant || (S.profil && S.profil.identifiant) || '?', evenement: evenement,
      detail: detail || '', poste: navigator.userAgent.replace(/^.*?\(([^)]*)\).*$/, '$1').slice(0, 60) }).catch(function () {});
  }

  /* ---------- droits ---------- */
  function droitsDe(p) {
    if (!p) return [];
    if (p.role === 'ADMIN_PRINCIPAL') return Object.keys(DROITS);
    return Array.isArray(p.droits) ? p.droits : (ROLES[p.role] || {}).droits || [];
  }
  function peut(d) { return droitsDe(S.profil).indexOf(d) >= 0; }
  function rang(role) { return (ROLES[role] || {}).rang || 0; }
  function enMaintenancePourMoi() { var m = S.ecole && S.ecole.maintenance; return !!(m && m.uid !== (S.moi && S.moi.uid)); }

  /* ===================================================================
   *  5. CONNEXION ET SESSION
   * =================================================================== */
  function surAuth(u) {
    var mv = /^#verifier\/([A-Za-z0-9]+)/.exec(location.hash); if (mv) { arreterEcoutes(); return ecranVerification(mv[1], u); }
    arreterEcoutes();
    S.moi = u; S.profil = null; S.pret = false;
    if (!u) { if (!ecranCreation) ecranConnexion(); return; }
    if (ecranCreation) return;   /* la création de l'école gère la suite */
    col('utilisateurs').doc(u.uid).get().then(function (s) {
      if (!s.exists) { journal('REFUS', 'Compte sans fiche utilisateur', u.email.split('@')[0]); return refuser('Ce compte n\'est pas autorisé dans cette école.'); }
      var p = s.data(); p.uid = u.uid;
      if (!p.actif) { journal('REFUS', 'Compte désactivé', p.identifiant); return refuser('Ce compte est désactivé. Adressez-vous à l\'administrateur.'); }
      if (p.expire_ms && Date.now() > p.expire_ms) { journal('REFUS', 'Compte de démonstration expiré', p.identifiant); return refuser('Ce compte de démonstration a expiré.'); }
      S.profil = p;
      ecrireLocal(CLE_ECHECS + '.' + p.identifiant, null);
      col('utilisateurs').doc(u.uid).update({ derniere_connexion: maintenant() }).catch(function () {});
      if (p.doit_changer) return ecranChangerMdp(true);
      ouvrirSession();
    }).catch(function (err) {
      if (/offline|unavailable/.test(err.code || '')) return refuser('Pas de connexion internet pour vérifier votre compte. Réessayez avec du réseau.');
      refuser(messageAuth(err));
    });
  }
  function refuser(msg) { auth.signOut(); ecranConnexion(msg); }

  function ouvrirSession() {
    journal('CONNEXION', ROLES[S.profil.role].nom);
    ecouter();
    presence();
    minuteurPresence = setInterval(presence, 120000);
    setTimeout(remplacerProvisoires, 6000);
    rendreCadre();
  }
  function deconnexion() {
    if (S.attente && !confirm(S.attente + ' enregistrement(s) pas encore envoyé(s). Se déconnecter quand même ?')) return;
    journal('DECONNEXION', '');
    col('presence').doc(S.moi.uid).delete().catch(function () {});
    clearInterval(minuteurPresence);
    setTimeout(function () { auth.signOut(); }, 300);
  }

  /* ---------- écoutes en temps réel ---------- */
  function ecouter() {
    var premier = {};
    function suivreCollection(nom, cible, requete) {
      premier[nom] = false;
      ecoutes.push((requete || col(nom)).onSnapshot({ includeMetadataChanges: true }, function (snap) {
        if (Array.isArray(S[cible])) S[cible] = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
        else {
          snap.docChanges().forEach(function (c) {
            if (c.type === 'removed') delete S[cible][c.doc.id];
            else { var x = c.doc.data(); x.id = c.doc.id; S[cible][c.doc.id] = x; }
          });
        }
        S.depuisCache = snap.metadata.fromCache;
        if (!snap.metadata.fromCache && !snap.metadata.hasPendingWrites) S.derniereSync = maintenant();
        premier[nom] = true;
        if (Object.keys(premier).every(function (k) { return premier[k]; })) S.pret = true;
        rendrePlusTard();
      }, function (err) { console.warn(nom, err); toast('Lecture refusée (' + nom + ') : ' + messageAuth(err), 'ko'); }));
    }
    ecoutes.push(docEcole().onSnapshot({ includeMetadataChanges: true }, function (s) {
      S.ecole = s.exists ? s.data() : null; majEtat(); rendrePlusTard();
    }));
    ['utilisateurs', 'niveaux', 'classes', 'matieres', 'tarifs', 'listes', 'presence', 'eleves', 'personnel', 'affectations', 'decisions', 'resultats', 'epreuves'].forEach(function (n) { suivreCollection(n, n); });
    if (peut('DOCUMENTS')) suivreCollection('documents_registre', 'documents_registre');
    if (peut('CAISSE') || peut('FINANCES')) { suivreCollection('caisse', 'caisse'); suivreCollection('stock', 'stock'); }
    suivreCollection('activite', 'activite', col('activite').orderBy('le', 'desc').limit(30));
    if (peut('UTILISATEURS')) suivreCollection('journal_acces', 'journal', col('journal_acces').orderBy('le', 'desc').limit(300));
    ecoutes.push(col('utilisateurs').doc(S.moi.uid).onSnapshot(function (s) {   /* compte modifié ou désactivé à distance */
      if (!s.exists || !s.data().actif) { toast('Votre compte a été désactivé.', 'ko'); auth.signOut(); return; }
      var p = s.data(); p.uid = S.moi.uid; S.profil = p; rendrePlusTard();
    }));
  }
  function arreterEcoutes() { ecoutes.forEach(function (f) { try { f(); } catch (x) { /* déjà arrêtée */ } }); ecoutes = []; clearInterval(minuteurPresence); }
  function presence() {
    if (!S.moi || !S.profil) return;
    col('presence').doc(S.moi.uid).set({ identifiant: S.profil.identifiant, nom: S.profil.nom, role: S.profil.role, ecran: TITRES[vueCourante()] || '', vu: maintenant() }).catch(function () {});
  }
  function connectes() {
    return trier(S.presence, function (a, b) { return a.nom.localeCompare(b.nom); }).filter(function (p) { return Date.now() - Date.parse(p.vu) < 300000; });
  }

  /* ===================================================================
   *  6. ÉCRANS HORS SESSION

  var ecranCreation = false;
  function plein(html) { $('#racine').innerHTML = '<div class="ecran-accueil">' + html + '</div>'; }

  function ecranConfig(msg) {

      '<textarea name="cfg" rows="8" placeholder="const firebaseConfig = { apiKey: &quot;…&quot;, … };"></textarea>' +

    $('#f-config').onsubmit = function (ev) {

  function bloqueJusqua(id) { var t = Number(lireLocal(CLE_ECHECS + '.' + id + '.bloque')) || 0; return t > Date.now() ? t : 0; }
  function noterEchec(id) {

  function ecranConnexion(msg) {
    plein('<form class="boite" id="f-cnx" autocomplete="on"><p class="marque">CTEFA-CLASSIC Web</p><h2>Connexion</h2>' +

      '<div class="champ"><label>Mot de passe</label><input name="mdp" type="password" autocomplete="current-password" required></div>' +

      this.querySelector('button').disabled = true;
      auth.signInWithEmailAndPassword(emailDe(id), mdp).catch(function (err) {
        var n = /wrong-password|invalid-credential|user-not-found|invalid-login/.test(err.code || '') ? noterEchec(id) : 0;
        ecranConnexion(messageAuth(err) + (n && n < 5 ? ' (' + (5 - n) + ' essai(s) restant(s))' : n >= 5 ? ' Compte bloqué 15 minutes sur cet appareil.' : ''));
      });
    };
    $('#b-creer').onclick = ecranCreerEcole;
    $('#b-autre').onclick = function () { if (confirm('Oublier la base actuelle sur cet appareil ?')) { ecrireLocal(CLE_CONFIG, null); location.reload(); } };
  }

  /* ---------- premier démarrage : assistant de création ---------- */
  function ecranCreerEcole(msg) {
    var cyc = Object.keys(CYCLES).map(function (k) { return '<label style="display:flex;gap:8px;align-items:center;color:var(--texte)"><input type="checkbox" name="cycle" value="' + k + '"' + (k === 'ELEMENTAIRE' ? ' checked' : '') + '> ' + CYCLES[k] + '</label>'; }).join('');
    plein('<form class="boite large" id="f-creer"><p class="marque">CTEFA-CLASSIC Web · premier démarrage</p><h2>Créer l\'école et l\'administrateur principal</h2>' +
      (msg ? '<div class="alerte ko">' + e(msg) + '</div>' : '') +
      '<div class="grille"><div><h3 style="margin-bottom:8px">1. L\'école</h3>' +
      '<div class="champ"><label>Nom de l\'école</label><input name="nom" required></div>' +
      '<div class="champ"><label>Type</label><select name="type"><option value="PUBLIQUE">Publique</option><option value="PRIVEE">Privée</option></select></div>' +
      '<div class="champ"><label>Nature</label><select name="nature"><option value="FRANCO_ARABE">Franco-arabe</option><option value="CLASSIQUE">Classique (français)</option></select></div>' +
      '<div class="champ"><label>Année scolaire</label><input name="annee" required value="' + anneeScolaire() + '"></div>' +
      '<div class="champ"><label>Cycles</label>' + cyc + '</div>' +
      '<label style="display:flex;gap:8px;align-items:center;color:var(--texte)"><input type="checkbox" name="classes" checked> Créer une classe par niveau</label></div>' +
      '<div><h3 style="margin-bottom:8px">2. Administrateur principal</h3>' +
      '<div class="champ"><label>Nom complet</label><input name="nomadmin" required></div>' +
      '<div class="champ"><label>Identifiant (minuscules, sans espace)</label><input name="ident" required autocapitalize="none" placeholder="admin"></div>' +
      '<div class="champ"><label>Mot de passe (8 caractères, lettres et chiffres)</label><input name="mdp" type="password" required autocomplete="new-password"></div>' +
      '<div class="champ"><label>Confirmer le mot de passe</label><input name="mdp2" type="password" required autocomplete="new-password"></div>' +
      '<p class="aide">Notez ces informations et gardez-les en lieu sûr. Pensez ensuite à créer un 2e administrateur principal (compte de secours).</p></div></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn plein">Créer l\'école</button><button type="button" class="btn" id="b-ret">Retour</button></div></form>');
    $('#b-ret').onclick = function () { ecranConnexion(); };
    $('#f-creer').onsubmit = function (ev) {
      ev.preventDefault();
      var f = this, id = f.ident.value.trim().toLowerCase(), cycles = $$('[name=cycle]:checked', f).map(function (c) { return c.value; });
      if (!identifiantValide(id)) return ecranCreerEcole('Identifiant : 3 à 30 caractères, lettres minuscules, chiffres, point ou tiret.');
      if (!motDePasseValide(f.mdp.value)) return ecranCreerEcole('Mot de passe : au moins 8 caractères, avec des lettres et des chiffres.');
      if (f.mdp.value !== f.mdp2.value) return ecranCreerEcole('Les deux mots de passe ne sont pas identiques.');
      if (!cycles.length) return ecranCreerEcole('Cochez au moins un cycle.');
      var info = { nom: f.nom.value.trim(), type: f.type.value, nature: f.nature.value, annee: f.annee.value.trim(), cycles: cycles,
                   nomadmin: f.nomadmin.value.trim(), id: id, classes: f.classes.checked };

      creerEcole(info, f.mdp.value).catch(function (err) {
        ecranCreation = false;
        if (auth.currentUser) auth.signOut();
        ecranCreerEcole(/permission/.test(err.code || '') ? 'Cette base contient déjà une école : connectez-vous avec un compte existant.' : messageAuth(err));
      });
    };
  }
  function etape(t) { var p = $('#etape-creation'); if (p) p.textContent = t; }
  function anneeScolaire() { var d = new Date(), a = d.getFullYear(); return d.getMonth() >= 8 ? a + '-' + (a + 1) : (a - 1) + '-' + a; }

  function creerEcole(info, mdp) {
    ecranCreation = true;
    var uid;
    return auth.createUserWithEmailAndPassword(emailDe(info.id), mdp).then(function (c) {
      uid = c.user.uid;
      etape('Enregistrement de l\'école');
      return docEcole().set({ nom: info.nom, nom_ar: '', type: info.type, nature: info.nature, annee: info.annee, cycles: info.cycles,
        ia: '', ief: '', code: '', adresse: '', telephone: '', lieu: '', signataire: info.nomadmin, qualite: 'Le Directeur', logo: '', cachet: '', cachet_actif: true,
        licence: { jusqu_au: null }, maintenance: null, fondateur: uid, cree_le: maintenant(), version: 1, modifie_par: info.id, modifie_le: maintenant() });
    }).then(function () {
      return col('utilisateurs').doc(uid).set({ identifiant: info.id, nom: info.nomadmin, role: 'ADMIN_PRINCIPAL', droits: ROLES.ADMIN_PRINCIPAL.droits, actif: true,
        doit_changer: false, expire_ms: null, cree_par: info.id, cree_le: maintenant(), modifie_par: info.id, modifie_le: maintenant(), version: 1 });
    }).then(function () {
      S.profil = { identifiant: info.id, nom: info.nomadmin, role: 'ADMIN_PRINCIPAL', uid: uid }; S.moi = auth.currentUser;
      etape('Mise en place des référentiels (niveaux, matières, listes, tarifs)');
      return semer(info.cycles, info.classes, true);
    }).then(function () {
      journal('CREATION_ECOLE', info.nom);
      ecranCreation = false;
      surAuth(auth.currentUser);
    });
  }

  /** Crée les référentiels manquants pour les cycles choisis (création ou « Réparer ») */
  function semer(cycles, avecClasses, complet) {
    var ops = [], mt = meta(true);
    var niveauxExistants = {}, matExist = {};
    Object.keys(S.niveaux).forEach(function (k) { niveauxExistants[S.niveaux[k].code] = true; });
    Object.keys(S.matieres).forEach(function (k) { var m = S.matieres[k]; matExist[m.niveau + '|' + m.ordre] = true; });
    SEMENCE.niveaux.filter(function (n) { return cycles.indexOf(n.cycle) >= 0; }).forEach(function (n) {
      if (!niveauxExistants[n.code]) ops.push([col('niveaux').doc(n.code), Object.assign({}, n, mt)]);
      if (avecClasses && !Object.keys(S.classes).some(function (k) { return S.classes[k].niveau === n.code; }))
        ops.push([col('classes').doc(), Object.assign({ code: n.code, nom: n.nom, niveau: n.code, effectif_max: 50, salle: '', titulaire_fr: '', titulaire_ar: '' }, mt)]);
    });
    SEMENCE.matieres.filter(function (m) { var n = SEMENCE.niveaux.find(function (x) { return x.code === m.niveau; }); return n && cycles.indexOf(n.cycle) >= 0 && !matExist[m.niveau + '|' + m.ordre]; })
      .forEach(function (m) { ops.push([col('matieres').doc(), Object.assign({}, m, mt)]); });
    var L = SEMENCE.listes;
    [['mois', L.mois], ['types_eleve', L.types_eleve], ['statuts', L.statuts], ['motifs_sortie', L.motifs_sortie], ['comptes', L.comptes], ['periodicites', L.periodicites], ['categories_caisse', L.categories_caisse]]
      .forEach(function (x) { if (complet || !S.listes[x[0]]) ops.push([col('listes').doc(x[0]), Object.assign({ valeurs: x[1] }, mt)]); });
    SEMENCE.tarifs.forEach(function (t) {
      var idt = t.categorie.replace(/[^A-Za-z0-9]+/g, '_');
      if (complet || !S.tarifs[idt]) ops.push([col('tarifs').doc(idt), Object.assign({ categorie: t.categorie, periodicite: t.periodicite, obligatoire: t.obligatoire, montants: {} }, mt)]);
    });
    var lots = [];
    for (var i = 0; i < ops.length; i += 400) {
      var b = db.batch(); ops.slice(i, i + 400).forEach(function (o) { b.set(o[0], o[1]); }); lots.push(suivre(b.commit()));
    }
    return Promise.all(lots).then(function () { return ops.length; });
  }

  function ecranChangerMdp(oblige) {
    var html = '<form class="boite" id="f-mdp"><h2>' + (oblige ? 'Choisissez votre mot de passe' : 'Changer mon mot de passe') + '</h2>' +

  /** Transcription phonétique (dernier recours) : à faire vérifier */
  function transcrire(mot) {
    var w = String(mot).toLowerCase().normalize('NFD').replace(/[̀-́]/g, '').replace(/[̂-ͯ]/g, '').replace(/[^a-z]/g, '');

      if (debut && voy(c)) { r += (c === 'i' || c === 'e') ? 'إ' : (t2 === 'ou' || c === 'o' || c === 'u') ? 'أو' : 'أ'; i += (t2 === 'ou') ? 2 : 1; debut = false; continue; }
      debut = false;

      if (map2[t2] && !(t2 === 'gu' && !voy(w[i + 2] || ''))) { r += map2[t2]; i += 2; continue; }
      if (c === 'c') { r += (s === 'e' || s === 'i') ? 'س' : 'ك'; i++; continue; }
      if (c === s && !voy(c)) { i++; continue; }   /* consonne doublée */

  /** Propose l'écriture arabe d'un prénom ou d'un nom ; renvoie { texte, sur } (sur = tout trouvé dans un dictionnaire) */

    "                          && request.resource.data.role == 'ADMIN_PRINCIPAL')",
    "                      || (droit('UTILISATEURS') && libre() && (principal() || rang(request.resource.data.role) < rang(moi().role)));",
    "        allow update: if (droit('UTILISATEURS') && libre() && uid != request.auth.uid",
    "                          && (principal() || (rang(resource.data.role) < rang(moi().role) && rang(request.resource.data.role) < rang(moi().role))))",
    "                      || (request.auth != null && uid == request.auth.uid",
    "                          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['doit_changer', 'derniere_connexion', 'modifie_le', 'modifie_par']))",
    "                      || (principal() && uid == request.auth.uid);",
    "        allow delete: if principal();",
    "      }",
    "      match /matricules/{m} {",
    "        allow read: if membre();",
    "        allow create, delete: if droit('ELEVES') && libre();",
    "      }",
    "      match /journal_acces/{id} {",
    "        allow read: if droit('UTILISATEURS');",
    "        allow create: if membre() || (request.auth != null && request.resource.data.evenement == 'REFUS');",
    "      }",
    "      match /verifications/{cle} {",
    "        allow get: if true;",
    "        allow create, update: if droit('DOCUMENTS') && libre();",
    "      }",
    "      match /{nom}/{id} {",
    "        allow read: if membre();",
    "        allow create, update: if membre() && libre() && peutEcrire(nom);",
    "        allow delete: if membre() && libre() && peutEcrire(nom) && nom != 'caisse' && nom != 'journal_acces';",
    "      }",
    "      function peutEcrire(nom) {",
    "        return (nom in ['niveaux', 'classes', 'matieres', 'tarifs', 'listes', 'sauvegardes'] && droit('PARAMETRES'))",
    "          || (nom == 'eleves' && droit('ELEVES'))",
    "          || (nom in ['notes', 'epreuves'] && droit('NOTES'))",
    "          || (nom in ['decisions', 'resultats'] && droit('BULLETINS'))",
    "          || (nom in ['caisse', 'restes_dus', 'stock'] && droit('CAISSE'))",
    "          || (nom in ['personnel', 'affectations'] && droit('PERSONNEL'))",
    "          || (nom == 'documents_registre' && droit('DOCUMENTS'))",
    "          || (nom in ['presences', 'pointages', 'quantum'] && droit('LISTES'))",
    "          || (nom in ['presence', 'activite', 'compteurs', 'verrous'] && membre())",
    "          || principal();",
    "      }",
    "    }",
    "  }",
    "}"
  ].join('\n');

  /* ===================================================================
   *  11. DÉMARRAGE
   * =================================================================== */
  window.CtefaDebug = { S: S, prochainNumero: prochainNumero, modifier: modifier };
  if (!window.firebase) { plein('<div class="boite"><h2>Connexion internet nécessaire</h2><p>Le tout premier chargement de l\'application demande internet ; ensuite elle s\'ouvre aussi hors ligne.</p><p><button class="btn plein" onclick="location.reload()">Réessayer</button></p></div>'); return; }
  if (!CFG) ecranConfig(); else demarrerFirebase();
})();
</script>
