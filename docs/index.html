<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTEFA-CLASSIC Web</title>
<meta name="description" content="Gestion scolaire multi-utilisateurs : comptes, droits, école, référentiels, synchronisation en temps réel.">
<meta name="theme-color" content="#153A62">
<style>
/* =====================================================================
 *  CTEFA-CLASSIC Web — étape 1 : socle (comptes, droits, journal, école,
 *  référentiels, synchronisation en temps réel, sauvegarde/restauration)
 * ===================================================================== */
:root {
  --bleu: #153A62; --ambre: #BF8F00; --vert: #277740; --gris: #595959; --rouge: #B3261E;
  --fond: #F3F5F8; --carte: #FFFFFF; --texte: #1F2328; --doux: #5B6470; --bord: #D9DEE5; --survol: #EEF3F9; --entete: #153A62;
  --champ: #FFFFFF; --info: #E8F0FA; --attention: #FFF4D6; --ok: #E6F3EA; --ko: #FCE8E6;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fond: #12161C; --carte: #1B2129; --texte: #E6E9ED; --doux: #A3ACB8; --bord: #2E3743; --survol: #232B36; --entete: #0E2742;
  --champ: #151A21; --info: #1A2A3D; --attention: #3A3115; --ok: #17301F; --ko: #3B1D1B; } }
:root[data-theme="dark"] {
  --fond: #12161C; --carte: #1B2129; --texte: #E6E9ED; --doux: #A3ACB8; --bord: #2E3743; --survol: #232B36; --entete: #0E2742;
  --champ: #151A21; --info: #1A2A3D; --attention: #3A3115; --ok: #17301F; --ko: #3B1D1B; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--fond); color: var(--texte); }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
.entete { background: var(--entete); color: #fff; position: sticky; top: 0; z-index: 20; }
.entete-haut { display: flex; align-items: center; gap: 10px; padding: 10px 16px; flex-wrap: wrap; }
.entete h1 { font-size: 1.05rem; margin: 0; flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.etat-sync { font-size: .78rem; border-radius: 999px; padding: 3px 10px; background: rgba(255,255,255,.15); white-space: nowrap; border: 0; color: #fff; cursor: pointer; }
.etat-sync[data-c="ok"] { background: #277740; } .etat-sync[data-c="att"] { background: #BF8F00; } .etat-sync[data-c="ko"] { background: #B3261E; }
.btn-entete { background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 8px; padding: 4px 9px; cursor: pointer; font-size: .82rem; }
.nav { display: flex; gap: 2px; overflow-x: auto; padding: 0 10px; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { color: #DCE6F2; text-decoration: none; padding: 9px 10px; white-space: nowrap; border-bottom: 3px solid transparent; font-size: .92rem; }
.nav a.actif { color: #fff; border-bottom-color: var(--ambre); font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
h2 { font-size: 1.25rem; margin: 4px 0 14px; }
h3 { font-size: 1rem; margin: 0; }
.carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; margin-bottom: 16px; }
.carte-tete { padding: 12px 16px; border-bottom: 1px solid var(--bord); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.carte-tete h3 { flex: 1 1 auto; }
.carte-corps { padding: 14px 16px; }
.carte-pied { padding: 10px 16px; border-top: 1px solid var(--bord); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.grille > * { min-width: 0; }
.tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.tuile { background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; padding: 12px 14px; }
.tuile .lib { font-size: .8rem; color: var(--doux); }
.tuile .val { font-size: 1.5rem; font-weight: 700; color: var(--bleu); }
:root[data-theme="dark"] .tuile .val { color: #8FB8E8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tuile .val { color: #8FB8E8; } }
label { display: block; font-size: .82rem; color: var(--doux); margin: 0 0 4px; }
.champ { margin-bottom: 10px; }
input, select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--bord); border-radius: 8px; background: var(--champ); min-height: 40px; }
input[type="checkbox"], input[type="radio"] { width: auto; min-height: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid #5C8FCB; outline-offset: 0; }
.aide { font-size: .82rem; color: var(--doux); }
.ligne { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.ligne > * { flex: 1 1 160px; min-width: 0; }
.ligne > .fixe { flex: 0 0 auto; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--bleu); color: var(--bleu); background: transparent; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; text-decoration: none; min-height: 40px; }
:root[data-theme="dark"] .btn { color: #8FB8E8; border-color: #8FB8E8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #8FB8E8; border-color: #8FB8E8; } }
.btn.plein { background: var(--bleu); color: #fff; border-color: var(--bleu); }
.btn.vert { background: var(--vert); border-color: var(--vert); color: #fff; }
.btn.danger { border-color: var(--rouge); color: var(--rouge); }
.btn.petit { padding: 4px 9px; min-height: 32px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.table-defil { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--bord); text-align: left; vertical-align: middle; }
th { font-size: .76rem; text-transform: uppercase; letter-spacing: .3px; color: var(--doux); background: var(--survol); }
td input, td select { min-height: 34px; padding: 5px 7px; }
.c { text-align: center; } .d { text-align: right; }
.pastille { display: inline-block; font-size: .74rem; border-radius: 999px; padding: 1px 8px; background: var(--info); }
.pastille.ok { background: var(--ok); } .pastille.ko { background: var(--ko); } .pastille.att { background: var(--attention); }
.alerte { border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; background: var(--info); border: 1px solid var(--bord); }
.alerte.att { background: var(--attention); } .alerte.ko { background: var(--ko); }
.onglets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.onglets a { text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--bord); background: var(--carte); font-size: .9rem; }
.onglets a.actif { background: var(--bleu); color: #fff; border-color: var(--bleu); }
.liste-simple { list-style: none; margin: 0; padding: 0; }
.liste-simple li { padding: 7px 0; border-bottom: 1px solid var(--bord); }
.liste-simple li:last-child { border-bottom: 0; }
.point { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--vert); margin-right: 6px; }
.voile { position: fixed; inset: 0; background: rgba(10,20,35,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.boite { background: var(--carte); border-radius: 14px; width: 100%; max-width: 440px; max-height: 92vh; overflow: auto; padding: 18px; }
.boite.large { max-width: 720px; }
.boite h2 { margin-top: 0; }
.ecran-accueil { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--entete); }
.ecran-accueil .boite { box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.marque { color: var(--bleu); font-weight: 800; letter-spacing: .5px; }
#toasts { position: fixed; bottom: 16px; right: 16px; left: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; z-index: 60; pointer-events: none; }
.toast { background: #2B3440; color: #fff; padding: 10px 14px; border-radius: 10px; max-width: 420px; pointer-events: auto; }
.toast.ok { background: var(--vert); } .toast.ko { background: var(--rouge); }
.bandeau { padding: 8px 16px; text-align: center; font-size: .9rem; }
.bandeau.maint { background: var(--ambre); color: #000; }
.bandeau.lecture { background: var(--gris); color: #fff; }
.droits { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 10px; }
.droits label { display: flex; gap: 6px; align-items: center; color: var(--texte); font-size: .88rem; margin: 0; }
.vignette { max-width: 120px; max-height: 80px; border: 1px solid var(--bord); border-radius: 6px; background: #fff; }
.pied { text-align: center; font-size: .8rem; color: var(--doux); padding: 10px 16px 24px; }
.cache { display: none !important; }
@media (max-width: 600px) { .mm { display: none; } main { padding: 12px; } }
@media print { .entete, .nav, .carte-pied, #toasts, .pas-imprimer { display: none !important; } body { background: #fff; } .carte { border: 0; } }
</style>

  var ASSISTANCE = 'Baye Modou DIOP — 78 295 80 96 / 76 518 55 48';

  function lireLocal(k) { try { return localStorage.getItem(k); } catch (x) { return null; } }
  function ecrireLocal(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (x) { /* navigation privée */ } }

  (function theme() { var t = lireLocal(CLE_THEME); if (t) document.documentElement.dataset.theme = t; })();

  function configDepuisLien() {
    var m = location.hash.match(/config=([A-Za-z0-9+/=_-]+)/);
    if (!m) return null;
    try {
      var c = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))));
      if (c && c.apiKey && c.projectId) { ecrireLocal(CLE_CONFIG, JSON.stringify(c)); history.replaceState(null, '', location.pathname); return c; }
    } catch (x) { /* lien abîmé */ }
    return null;
  }
  function configuration() {
    var c = CONFIG_INTEGREE || configDepuisLien();

  }
  /** Accepte le bloc copié depuis la console Firebase (const firebaseConfig = {...}) */
  function lireBlocConfig(texte) {
    var t = String(texte || ''), o = {};
    ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'].forEach(function (k) {
      var m = t.match(new RegExp(k + '\\s*["\']?\\s*:\\s*["\']([^"\']+)["\']'));

    });

  }
  function lienInstallation(c) {
    var b = btoa(unescape(encodeURIComponent(JSON.stringify(c)))).replace(/\+/g, '-').replace(/\//g, '_');

  }

  /* ===================================================================
   *  2. RÔLES ET DROITS
   * =================================================================== */
  var DROITS = {
    NOTES: 'Saisie des notes', BULLETINS: 'Bulletins et résultats', ELEVES: 'Élèves', DOCUMENTS: 'Documents', LISTES: 'Listes et éditions',
    CAISSE: 'Caisse', FINANCES: 'Finances', PERSONNEL: 'Personnel', PARAMETRES: 'Paramètres et référentiels', UTILISATEURS: 'Utilisateurs',
    MIGRATION: 'Migration annuelle', DEVERROUILLER: 'Déverrouiller', ECOLE: 'Programmation de l\'école', ASSISTANT: 'Assistant de configuration', MISEAJOUR: 'Mise à jour / reprise'
  };
  var ROLES = {
    ADMIN_PRINCIPAL: { nom: 'Administrateur principal', rang: 7, droits: Object.keys(DROITS) },
    ADMIN_SECONDAIRE: { nom: 'Administrateur secondaire', rang: 6, droits: ['NOTES', 'BULLETINS', 'ELEVES', 'DOCUMENTS', 'LISTES', 'CAISSE', 'FINANCES', 'PERSONNEL', 'PARAMETRES', 'UTILISATEURS', 'MIGRATION', 'DEVERROUILLER', 'ASSISTANT'] },
    SECRETAIRE: { nom: 'Secrétaire', rang: 4, droits: ['ELEVES', 'DOCUMENTS', 'LISTES', 'PERSONNEL', 'BULLETINS'] },
    CAISSIER: { nom: 'Caissier', rang: 4, droits: ['CAISSE', 'FINANCES', 'LISTES'] },

    CONSULTATION: { nom: 'Consultation', rang: 2, droits: [] },
    DEMONSTRATION: { nom: 'Démonstration', rang: 1, droits: ['NOTES', 'BULLETINS', 'ELEVES', 'DOCUMENTS', 'LISTES', 'CAISSE', 'FINANCES', 'PERSONNEL', 'PARAMETRES'] }
  };
  var CYCLES = { PRESCOLAIRE: 'Préscolaire', ELEMENTAIRE: 'Élémentaire et Majaalis', MOYEN: 'Moyen (CEM)', SECONDAIRE: 'Secondaire (lycée)' };
  var LANGUES = { FR: 'Français', AR: 'Arabe', LN: 'Langue nationale' };

  /* ===================================================================
   *  3. OUTILS
   * =================================================================== */
  function e(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function maintenant() { return new Date().toISOString(); }
  function heure(iso) { if (!iso) return ''; var d = new Date(iso); return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
  function ilya(iso) {
    if (!iso) return '';
    var s = Math.round((Date.now() - Date.parse(iso)) / 1000);
    if (s < 60) return 'il y a ' + Math.max(s, 0) + ' s';
    if (s < 3600) return 'il y a ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'il y a ' + Math.round(s / 3600) + ' h';
    return 'le ' + new Date(iso).toLocaleDateString('fr-FR');
  }
  function toast(msg, type) {
    var t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg;
    var z = $('#toasts'); while (z.children.length >= 3) z.firstChild.remove(); z.appendChild(t);
    setTimeout(function () { t.remove(); }, type === 'ko' ? 7000 : 3500);
  }
  function Erreur(msg) { this.message = msg; } Erreur.prototype = Object.create(Error.prototype);
  function trier(obj, fn) { return Object.keys(obj).map(function (k) { return obj[k]; }).sort(fn); }
  function telecharger(contenu, nom, type) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([contenu], { type: type })); a.download = nom;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  function identifiantValide(id) { return /^[a-z0-9][a-z0-9._-]{2,29}$/.test(id); }
  function emailDe(id) { return String(id).toLowerCase() + '@' + CFG.projectId + '.firebaseapp.com'; }
  function messageAuth(err) {
    var c = err && err.code || '';
    if (/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c)) return 'Identifiant ou mot de passe incorrect.';
    if (/too-many-requests/.test(c)) return 'Trop d\'essais : le compte est bloqué quelques minutes par sécurité.';
    if (/network/.test(c)) return 'Pas de connexion internet.';
    if (/weak-password/.test(c)) return 'Mot de passe trop faible : au moins 8 caractères.';
    if (/email-already-in-use/.test(c)) return 'Cet identifiant existe déjà.';
    if (/operation-not-allowed/.test(c)) return 'La connexion par mot de passe n\'est pas activée dans Firebase (Authentication).';
    if (/permission-denied/.test(c)) return 'Action refusée par les règles de sécurité de la base.';
    return (err && err.message) || 'Erreur inconnue.';
  }
  function motDePasseValide(m) { return String(m).length >= 8 && /\d/.test(m) && /[a-zA-Z]/.test(m); }

  /* ===================================================================
   *  4. FIREBASE
   * =================================================================== */
  var CFG = configuration(), db = null, auth = null, appli = null;
  var S = {   /* données en mémoire, tenues à jour par les écoutes */
    ecole: null, utilisateurs: {}, niveaux: {}, classes: {}, matieres: {}, tarifs: {}, listes: {}, presence: {}, activite: [], journal: [],
    moi: null, profil: null, pret: false, enLigne: navigator.onLine, attente: 0, derniereSync: null, depuisCache: true
  };
  var ecoutes = [], minuteurPresence = null;

  function demarrerFirebase() {
    appli = firebase.initializeApp(CFG);
    auth = firebase.auth(); db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(function () { /* un autre onglet ou navigateur ancien */ });
    window.addEventListener('online', function () { S.enLigne = true; majEtat(); });
    window.addEventListener('offline', function () { S.enLigne = false; majEtat(); });
    auth.onAuthStateChanged(surAuth);
  }
  function col(nom) { return db.collection(ESPACE + '/' + nom); }
  function docEcole() { return db.doc(ESPACE); }

  /* ---------- écriture avec suivi des envois en attente ---------- */
  function suivre(promesse) {
    S.attente++; majEtat();
    return promesse.then(function (r) { S.attente--; S.derniereSync = maintenant(); majEtat(); return r; },
      function (err) { S.attente--; majEtat(); throw err; });
  }
  function meta(nouveau) {
    var m = { modifie_par: S.profil ? S.profil.identifiant : '?', modifie_le: maintenant() };
    if (nouveau) { m.cree_par = m.modifie_par; m.cree_le = m.modifie_le; m.version = 1; }
    return m;
  }
  function verifierEcriture(droit) {
    if (enMaintenancePourMoi()) throw new Erreur('Maintenance en cours par ' + S.ecole.maintenance.nom + ' : lecture seule pour le moment.');
    if (droit && !peut(droit)) throw new Erreur('Votre compte n\'a pas le droit « ' + DROITS[droit] + ' ».');
  }
  /** Crée un document ; renvoie son id */
  function creer(nom, data, droit, id) {
    verifierEcriture(droit);
    var ref = id ? col(nom).doc(id) : col(nom).doc();
    suivre(ref.set(Object.assign({}, data, meta(true)))).catch(erreurEcriture);
    return ref.id;
  }
  /**
   * Modifie avec verrouillage optimiste : si quelqu'un a enregistré entre-temps
   * (version différente de celle affichée), on propose de recharger ou d'écraser.
   */
  function modifier(nom, id, changements, versionLue, droit) {
    verifierEcriture(droit);
    var ref = col(nom).doc(id);
    if (!S.enLigne) {   /* hors ligne : écriture mise en file, version incrémentée */
      suivre(ref.update(Object.assign({}, changements, meta(), { version: (versionLue || 0) + 1 }))).catch(erreurEcriture);
      return Promise.resolve(true);
    }
    return suivre(db.runTransaction(function (tx) {
      return tx.get(ref).then(function (snap) {
        if (!snap.exists) throw new Erreur('Cet élément a été supprimé par quelqu\'un d\'autre.');
        var d = snap.data();
        if (versionLue !== undefined && d.version !== versionLue) { var c = new Erreur('conflit'); c.conflit = d; throw c; }
        tx.update(ref, Object.assign({}, changements, meta(), { version: (d.version || 0) + 1 }));
      });
    })).then(function () { return true; }, function (err) {
      if (err.conflit) {
        var d = err.conflit;
        var ecraser = confirm('Modifié par ' + d.modifie_par + ' ' + ilya(d.modifie_le) + ' pendant que vous travailliez.\n\n' +
                              'OK = écraser avec vos changements\nAnnuler = garder leur version (l\'écran se recharge)');
        if (ecraser) return modifier(nom, id, changements, d.version, droit);
        rendre(); return false;
      }
      erreurEcriture(err); return false;
    });
  }
  function supprimer(nom, id, droit) {
    verifierEcriture(droit);
    return suivre(col(nom).doc(id).delete()).catch(erreurEcriture);
  }
  /** Compteur atomique (matricule, pièce de caisse, document) : jamais deux fois le même numéro */
  function prochainNumero(nom) {
    var ref = col('compteurs').doc(nom);
    return suivre(db.runTransaction(function (tx) {
      return tx.get(ref).then(function (s) {
        var n = (s.exists ? s.data().valeur : 0) + 1;
        tx.set(ref, Object.assign({ valeur: n }, meta(!s.exists)));
        return n;
      });
    }));
  }
  function erreurEcriture(err) {
    if (err instanceof Erreur) toast(err.message, 'ko');

  }
  function activite(texte) {

  }
  function journal(evenement, detail, identifiant) {
    col('journal_acces').add({ le: maintenant(), identifiant: identifiant || (S.profil && S.profil.identifiant) || '?', evenement: evenement,
      detail: detail || '', poste: navigator.userAgent.replace(/^.*?\(([^)]*)\).*$/, '$1').slice(0, 60) }).catch(function () {});
  }

  /* ---------- droits ---------- */
  function droitsDe(p) {

  }
  function peut(d) { return droitsDe(S.profil).indexOf(d) >= 0; }
  function rang(role) { return (ROLES[role] || {}).rang || 0; }
  function enMaintenancePourMoi() { var m = S.ecole && S.ecole.maintenance; return !!(m && m.uid !== (S.moi && S.moi.uid)); }

  /* ===================================================================
   *  5. CONNEXION ET SESSION
   * =================================================================== */
  function surAuth(u) {
    arreterEcoutes();
    S.moi = u; S.profil = null; S.pret = false;
    if (!u) { if (!ecranCreation) ecranConnexion(); return; }
    if (ecranCreation) return;   /* la création de l'école gère la suite */
    col('utilisateurs').doc(u.uid).get().then(function (s) {
      if (!s.exists) { journal('REFUS', 'Compte sans fiche utilisateur', u.email.split('@')[0]); return refuser('Ce compte n\'est pas autorisé dans cette école.'); }
      var p = s.data(); p.uid = u.uid;
      if (!p.actif) { journal('REFUS', 'Compte désactivé', p.identifiant); return refuser('Ce compte est désactivé. Adressez-vous à l\'administrateur.'); }
      if (p.expire_ms && Date.now() > p.expire_ms) { journal('REFUS', 'Compte de démonstration expiré', p.identifiant); return refuser('Ce compte de démonstration a expiré.'); }
      S.profil = p;
      ecrireLocal(CLE_ECHECS + '.' + p.identifiant, null);
      col('utilisateurs').doc(u.uid).update({ derniere_connexion: maintenant() }).catch(function () {});
      if (p.doit_changer) return ecranChangerMdp(true);
      ouvrirSession();
    }).catch(function (err) {
      if (/offline|unavailable/.test(err.code || '')) return refuser('Pas de connexion internet pour vérifier votre compte. Réessayez avec du réseau.');
      refuser(messageAuth(err));
    });
  }
  function refuser(msg) { auth.signOut(); ecranConnexion(msg); }

  function ouvrirSession() {
    journal('CONNEXION', ROLES[S.profil.role].nom);

  function deconnexion() {
    if (S.attente && !confirm(S.attente + ' enregistrement(s) pas encore envoyé(s). Se déconnecter quand même ?')) return;
    journal('DECONNEXION', '');
    col('presence').doc(S.moi.uid).delete().catch(function () {});

  /* ---------- écoutes en temps réel ---------- */
  function ecouter() {
    var premier = {};
    function suivreCollection(nom, cible, requete) {
      premier[nom] = false;
      ecoutes.push((requete || col(nom)).onSnapshot({ includeMetadataChanges: true }, function (snap) {
        if (Array.isArray(S[cible])) S[cible] = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
        else {
          snap.docChanges().forEach(function (c) {
            if (c.type === 'removed') delete S[cible][c.doc.id];
            else { var x = c.doc.data(); x.id = c.doc.id; S[cible][c.doc.id] = x; }
          });
        }
        S.depuisCache = snap.metadata.fromCache;
        if (!snap.metadata.fromCache && !snap.metadata.hasPendingWrites) S.derniereSync = maintenant();
        premier[nom] = true;
        if (Object.keys(premier).every(function (k) { return premier[k]; })) S.pret = true;
        rendrePlusTard();
      }, function (err) { console.warn(nom, err); toast('Lecture refusée (' + nom + ') : ' + messageAuth(err), 'ko'); }));
    }
    ecoutes.push(docEcole().onSnapshot({ includeMetadataChanges: true }, function (s) {
      S.ecole = s.exists ? s.data() : null; majEtat(); rendrePlusTard();
    }));
    ['utilisateurs', 'niveaux', 'classes', 'matieres', 'tarifs', 'listes', 'presence'].forEach(function (n) { suivreCollection(n, n); });
    suivreCollection('activite', 'activite', col('activite').orderBy('le', 'desc').limit(30));
    if (peut('UTILISATEURS')) suivreCollection('journal_acces', 'journal', col('journal_acces').orderBy('le', 'desc').limit(300));

  /* ---------- premier démarrage : assistant de création ---------- */
  function ecranCreerEcole(msg) {
    var cyc = Object.keys(CYCLES).map(function (k) { return '<label style="display:flex;gap:8px;align-items:center;color:var(--texte)"><input type="checkbox" name="cycle" value="' + k + '"' + (k === 'ELEMENTAIRE' ? ' checked' : '') + '> ' + CYCLES[k] + '</label>'; }).join('');
    plein('<form class="boite large" id="f-creer"><p class="marque">CTEFA-CLASSIC Web · premier démarrage</p><h2>Créer l\'école et l\'administrateur principal</h2>' +
      (msg ? '<div class="alerte ko">' + e(msg) + '</div>' : '') +

      .forEach(function (x) { if (complet || !S.listes[x[0]]) ops.push([col('listes').doc(x[0]), Object.assign({ valeurs: x[1] }, mt)]); });

  function exporterBase() {

    return docEcole().get().then(function (s) {

      return Promise.all(COLLECTIONS.map(function (n) { return col(n).get().then(function (q) { res.collections[n] = q.docs.map(function (d) { return { id: d.id, data: d.data() }; }); }); }));

  function nomFichier() { return 'ctefa_' + String(S.ecole.nom).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') + '_' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '') + '.json'; }

  function restaurer(fichier) {
    var r = new FileReader();
    r.onload = function () {
      var b;
      try { b = JSON.parse(r.result); } catch (x) { return toast('Fichier illisible.', 'ko'); }
      if (!b || b.application !== 'CTEFA-CLASSIC Web' || !b.collections || !b.ecole) return toast('Ce fichier n\'est pas une sauvegarde CTEFA-CLASSIC Web.', 'ko');
      var nb = Object.keys(b.collections).reduce(function (s, k) { return s + b.collections[k].length; }, 0);
      if (!confirm('Restaurer la sauvegarde du ' + heure(b.exporte_le) + ' (' + e(b.ecole.nom) + ', ' + nb + ' enregistrements) ?\n\nTOUTES les données actuelles seront remplacées.')) return;
      confirmerMdp('La restauration remplace toute la base de l\'école.').then(function () {
        toast('Copie de sécurité de la base actuelle…');
        return maintenance(true).then(sauver);
      }).then(function () {
        var ops = [];
        return Promise.all(COLLECTIONS.map(function (n) { return col(n).get(); })).then(function (snaps) {
          snaps.forEach(function (q, i) {
            var n = COLLECTIONS[i], gardes = {};
            (b.collections[n] || []).forEach(function (d) { gardes[d.id] = true; ops.push(['set', col(n).doc(d.id), d.data]); });
            q.docs.forEach(function (d) { if (!gardes[d.id] && !(n === 'utilisateurs' && d.id === S.moi.uid)) ops.push(['del', d.ref]); });
          });
          /* l'administrateur qui restaure reste toujours principal et actif */
          ops.push(['set', col('utilisateurs').doc(S.moi.uid), Object.assign({}, S.profil, { uid: undefined, role: 'ADMIN_PRINCIPAL', actif: true, droits: Object.keys(DROITS) })]);
          var lots = [];
          for (var k = 0; k < ops.length; k += 400) {
            var bt = db.batch();
            ops.slice(k, k + 400).forEach(function (o) { if (o[0] === 'set') bt.set(o[1], JSON.parse(JSON.stringify(o[2]))); else bt.delete(o[1]); });
            lots.push(suivre(bt.commit()));
          }
          return Promise.all(lots);
        }).then(function () {
          var ec = Object.assign({}, b.ecole, { maintenance: null, fondateur: S.ecole.fondateur, version: (S.ecole.version || 0) + 1, modifie_par: S.profil.identifiant, modifie_le: maintenant() });
          return suivre(docEcole().set(ec));
        }).then(function () {
          journal('RESTAURATION', 'Sauvegarde du ' + heure(b.exporte_le) + ', ' + ops.length + ' opérations'); activite('Base restaurée depuis une sauvegarde');
          toast('Restauration terminée.', 'ok');
        });
      }).catch(function (err) { maintenance(false).catch(function () {}); if (!(err instanceof Erreur && err.message === 'Action annulée.')) erreurEcriture(err); });

        if (!val.length) throw new Erreur('La liste ne peut pas être vide.');
        var idl = f.dataset.id;
        (S.listes[idl] ? modifier('listes', idl, { valeurs: val }, Number(f.dataset.version), 'PARAMETRES') : Promise.resolve(creer('listes', { valeurs: val }, 'PARAMETRES', idl)))
          .then(function (ok) { if (ok) toast('Liste enregistrée.', 'ok'); });
      }
    } catch (err) { erreurEcriture(err); }
  });

  /* ===================================================================
   *  10. RÈGLES DE SÉCURITÉ FIRESTORE (à publier dans la console)
   * =================================================================== */
  var REGLES = [
    "rules_version = '2';",
    "// CTEFA-CLASSIC Web : règles de sécurité (étape 1)",
    "service cloud.firestore {",
    "  match /databases/{database}/documents {",
    "    match /ecoles/{ecole} {",
    "      function chemin() { return /databases/$(database)/documents/ecoles/$(ecole); }",
    "      function moi() { return get(/databases/$(database)/documents/ecoles/$(ecole)/utilisateurs/$(request.auth.uid)).data; }",
    "      function membre() { return request.auth != null",
    "        && exists(/databases/$(database)/documents/ecoles/$(ecole)/utilisateurs/$(request.auth.uid))",
    "        && moi().actif == true && (moi().expire_ms == null || request.time.toMillis() < moi().expire_ms); }",
    "      function principal() { return membre() && moi().role == 'ADMIN_PRINCIPAL'; }",
    "      function droit(d) { return membre() && (moi().role == 'ADMIN_PRINCIPAL' || d in moi().droits); }",
    "      function rang(r) { return {'ADMIN_PRINCIPAL': 7, 'ADMIN_SECONDAIRE': 6, 'SECRETAIRE': 4, 'CAISSIER': 4, 'ENSEIGNANT': 3, 'CONSULTATION': 2, 'DEMONSTRATION': 1}[r]; }",
    "      function libre() { return get(chemin()).data.maintenance == null || get(chemin()).data.maintenance.uid == request.auth.uid; }",
    "",
    "      allow read: if membre();",
    "      allow create: if request.auth != null && request.resource.data.fondateur == request.auth.uid;",
    "      allow update: if (droit('PARAMETRES') && libre()",
    "                        && (droit('ECOLE') || !request.resource.data.diff(resource.data).affectedKeys().hasAny(['cycles', 'fondateur', 'licence'])))",
    "                    || (principal() && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['maintenance']));",
    "",
    "      match /utilisateurs/{uid} {",
    "        allow read: if membre();",
    "        // premier démarrage : le fondateur crée sa propre fiche d'administrateur principal",
    "        allow create: if (request.auth != null && request.auth.uid == uid && get(chemin()).data.fondateur == uid",
    "                          && request.resource.data.role == 'ADMIN_PRINCIPAL')",
    "                      || (droit('UTILISATEURS') && libre() && (principal() || rang(request.resource.data.role) < rang(moi().role)));",
    "        allow update: if (droit('UTILISATEURS') && libre() && uid != request.auth.uid",
    "                          && (principal() || (rang(resource.data.role) < rang(moi().role) && rang(request.resource.data.role) < rang(moi().role))))",
    "                      || (request.auth != null && uid == request.auth.uid",
    "                          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['doit_changer', 'derniere_connexion', 'modifie_le', 'modifie_par']))",
    "                      || (principal() && uid == request.auth.uid);",
    "        allow delete: if principal();",
    "      }",
    "      match /journal_acces/{id} {",
    "        allow read: if droit('UTILISATEURS');",
    "        allow create: if membre() || (request.auth != null && request.resource.data.evenement == 'REFUS');",
    "      }",
    "      match /{nom}/{id} {",
    "        allow read: if membre();",
    "        allow create, update: if membre() && libre() && peutEcrire(nom);",
    "        allow delete: if membre() && libre() && peutEcrire(nom) && nom != 'caisse' && nom != 'journal_acces';",
    "      }",
    "      function peutEcrire(nom) {",
    "        return (nom in ['niveaux', 'classes', 'matieres', 'tarifs', 'listes', 'sauvegardes'] && droit('PARAMETRES'))",
    "          || (nom == 'eleves' && droit('ELEVES'))",
    "          || (nom == 'notes' && droit('NOTES'))",
    "          || (nom in ['decisions', 'resultats'] && droit('BULLETINS'))",
    "          || (nom in ['caisse', 'restes_dus', 'stock'] && droit('CAISSE'))",
    "          || (nom in ['personnel', 'affectations'] && droit('PERSONNEL'))",
    "          || (nom == 'documents_registre' && droit('DOCUMENTS'))",
    "          || (nom in ['presences', 'pointages', 'quantum'] && droit('LISTES'))",
    "          || (nom in ['presence', 'activite', 'compteurs', 'verrous'] && membre())",
    "          || principal();",
    "      }",
    "    }",
    "  }",
    "}"
  ].join('\n');

  /* ===================================================================
   *  11. DÉMARRAGE
   * =================================================================== */
  window.CtefaDebug = { S: S, prochainNumero: prochainNumero, modifier: modifier };
  if (!window.firebase) { plein('<div class="boite"><h2>Connexion internet nécessaire</h2><p>Le premier chargement de l\'application demande internet.</p><p><button class="btn plein" onclick="location.reload()">Réessayer</button></p></div>'); return; }
  if (!CFG) ecranConfig(); else demarrerFirebase();
})();
</script>
